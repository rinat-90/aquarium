name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Format, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aquarium

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec prettier --check .

      - name: Generate Prisma client
        run: pnpm --filter @aquarium/database db:generate

      - name: Typecheck database
        run: pnpm --filter @aquarium/database typecheck

      - name: Typecheck API
        run: pnpm --filter @aquarium/api typecheck

      - name: Build web
        run: pnpm --filter @aquarium/web build
