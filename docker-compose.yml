services:
  postgres:
    image: postgres:17
    container_name: aquarium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aquarium
      POSTGRES_PASSWORD: aquarium_dev
      POSTGRES_DB: aquarium
    ports:
      - "5434:5432"
    volumes:
      - aquarium-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquarium -d aquarium"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  aquarium-postgres-data: